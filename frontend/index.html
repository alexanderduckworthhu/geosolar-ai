<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>GeoSolar AI — Swiss rooftop solar</title>
    <link rel="canonical" href="https://alexanderduckworthhu.github.io/geosolar-ai/" />
    <link rel="preconnect" href="https://server.arcgisonline.com" />
    <link rel="preload" href="data/hexes.json?v=2" as="fetch" crossorigin />
    <link rel="preload" href="data/roofs.json" as="fetch" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Outfit:wght@400;500;600&amp;display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="styles.css?v=18" />
  </head>
  <body>
    <header class="top">
      <div class="top-row">
        <a class="brand" href="./">
          <strong>GeoSolar</strong>
          <span>AI</span>
        </a>
        <div class="top-right">
          <nav class="site-nav" aria-label="Pages">
            <a href="./" class="on" id="nav-map">Map</a>
            <a href="about.html" id="nav-about">About</a>
          </nav>
          <nav class="langs" id="langs" aria-label="Language">
            <button type="button" data-lang="en" class="on">EN</button>
            <button type="button" data-lang="de">DE</button>
            <button type="button" data-lang="fr">FR</button>
            <button type="button" data-lang="it">IT</button>
          </nav>
        </div>
      </div>
      <p class="caption" id="caption"></p>
    </header>

    <div class="stage">
      <div class="map-wrap">
        <div id="map" role="application" aria-label="Switzerland solar map"></div>
        <p class="hint" id="hint"></p>
      </div>
      <form class="search" id="search" autocomplete="off">
        <label class="sr-only" id="lbl-search" for="search-input"></label>
        <input
          id="search-input"
          type="search"
          enterkeyhint="search"
          autocapitalize="off"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
          aria-autocomplete="list"
          aria-controls="search-results"
        />
        <button type="button" id="search-clear" hidden>×</button>
        <ul id="search-results" role="listbox" hidden></ul>
      </form>

      <aside class="panel" id="panel">
        <button type="button" class="sheet-handle" id="sheet-toggle" aria-expanded="false">
          <i class="sheet-bar"></i>
          <span id="sheet-peek"></span>
        </button>
        <div class="view-row" id="view-row">
          <button type="button" data-view="hex" id="btn-hex"></button>
          <button type="button" data-view="roofs" class="on" id="btn-roofs"></button>
        </div>

        <div class="view-row" id="base-row">
          <button type="button" data-base="on" class="on" id="btn-base-on"></button>
          <button type="button" data-base="off" id="btn-base-off"></button>
        </div>

        <div class="view-row" id="border-row">
          <button type="button" data-borders="on" class="on" id="btn-borders-on"></button>
          <button type="button" data-borders="off" id="btn-borders-off"></button>
        </div>

        <div class="city-row" id="city-row"></div>

        <div class="slider-block zoom-block">
          <span id="lbl-zoom"></span>
          <strong id="zoom-pct">0%</strong>
          <div class="zoom-controls">
            <button type="button" id="btn-zoom-out"></button>
            <input id="zoom-range" type="range" min="0" max="100" step="1" value="0" aria-labelledby="lbl-zoom" />
            <button type="button" id="btn-zoom-in"></button>
          </div>
        </div>

        <label class="slider-block">
          <span id="lbl-floor"></span>
          <strong id="floor-label">1</strong>
          <input id="class-floor" type="range" min="1" max="5" step="1" value="1" />
        </label>

        <div class="mode-row" id="mode-row">
          <button type="button" data-mode="mean" class="on" id="btn-mean"></button>
          <button type="button" data-mode="pct4" id="btn-pct4"></button>
        </div>

        <div id="stats">
          <p class="place-kicker" id="place-kicker"></p>
          <h2 id="place-name"></h2>
          <p class="sub" id="place-sub"></p>

          <div class="metrics">
            <div>
              <b id="m-mean">—</b>
              <span id="lbl-mean-metric"></span>
            </div>
            <div>
              <b id="m-pct4">—</b>
              <span id="lbl-pct-metric"></span>
            </div>
          </div>

          <p class="insight" id="insight"></p>

          <p class="chart-title" id="chart-title"></p>
          <div class="stack" id="bars"></div>
          <div class="axis">
            <span id="axis-low"></span>
            <span id="axis-high"></span>
          </div>

          <p class="baseline" id="baseline"></p>

          <div class="legend">
            <span><i class="dot moss"></i><span id="leg-low"></span></span>
            <span><i class="dot mid"></i><span id="leg-good"></span></span>
            <span><i class="dot sun"></i><span id="leg-ex"></span></span>
            <span><i class="dot empty"></i><span id="leg-floor"></span></span>
          </div>
        </div>
      </aside>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="i18n.js?v=10"></script>
    <script src="app.js?v=23"></script>
  </body>
</html>
