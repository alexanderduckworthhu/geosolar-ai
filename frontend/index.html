<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>GeoSolar AI — Swiss rooftop solar</title>
    <meta
      name="description"
      content="Explorer of official Sonnendach.ch rooftop solar classes for Switzerland. Hex neighbourhoods from 10 million roofs, plus a 100,000-roof sample."
    />
    <meta property="og:title" content="GeoSolar AI — Swiss rooftop solar" />
    <meta
      property="og:description"
      content="Official BFE / swisstopo / MeteoSwiss roof classes on a map. No kWh forecast."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://alexanderduckworthhu.github.io/geosolar-ai/" />
    <meta property="og:image" content="https://alexanderduckworthhu.github.io/geosolar-ai/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://alexanderduckworthhu.github.io/geosolar-ai/" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://server.arcgisonline.com" />
    <link rel="preload" href="data/hexes.json?v=5" as="fetch" crossorigin />
    <link rel="preload" href="data/roofs.json" as="fetch" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Outfit:wght@400;500;600&amp;display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="styles.css?v=34" />
  </head>
  <body>
    <header class="top">
      <div class="top-row">
        <a class="brand" href="./">
          <strong>GeoSolar</strong>
          <span>AI</span>
        </a>
        <div class="top-right">
          <nav class="site-nav" aria-label="Pages">
            <a href="./" class="on" id="nav-map">Map</a>
            <a href="about.html" id="nav-about">About</a>
          </nav>
          <nav class="langs" id="langs" aria-label="Language">
            <button type="button" data-lang="en" class="on">EN</button>
            <button type="button" data-lang="de">DE</button>
            <button type="button" data-lang="fr">FR</button>
            <button type="button" data-lang="it">IT</button>
          </nav>
        </div>
      </div>
      <p class="caption" id="caption"></p>
    </header>

    <div class="stage">
      <div class="map-wrap">
        <div id="map" role="application" aria-label="Switzerland solar map"></div>
        <p class="load-status" id="load-status" hidden></p>
        <p class="hint" id="hint"></p>
        <button type="button" id="btn-chat" class="chat-toggle" aria-expanded="false" aria-controls="chat">
          <svg class="icon-chat" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M5 6.4A2.4 2.4 0 0 1 7.4 4h9.2A2.4 2.4 0 0 1 19 6.4v6.7a2.4 2.4 0 0 1-2.4 2.4H12l-3.4 2.7c-.7.55-1.7.06-1.7-.8v-1.9H7.4A2.4 2.4 0 0 1 5 13.1V6.4Z"
            />
          </svg>
          <svg class="icon-close" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4 6.4 19 5 17.6 10.6 12 5 6.4Z" />
          </svg>
        </button>
        <section class="chat" id="chat" hidden>
          <div class="chat-head">
            <p class="chat-label" id="ask-label"></p>
            <button type="button" id="chat-close">×</button>
          </div>
          <div class="chat-log" id="chat-log" role="log" aria-live="polite"></div>
          <form class="ask" id="ask-form">
            <div class="ask-row">
              <input id="ask-input" type="text" autocomplete="off" />
              <button type="submit" id="ask-go" aria-label="Send">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path fill="currentColor" d="M4 12.2 19.2 4.8c.7-.3 1.4.4 1.1 1.1L13.6 20c-.3.8-1.4.7-1.6-.1l-1.6-6.1-6.1-1.6c-.8-.2-.9-1.3-.3-1.6Z" />
                </svg>
              </button>
            </div>
          </form>
        </section>
      </div>
      <form class="search" id="search" autocomplete="off">
        <label class="sr-only" id="lbl-search" for="search-input"></label>
        <div class="search-field">
          <input
            id="search-input"
            type="search"
            enterkeyhint="search"
            autocapitalize="off"
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
            aria-autocomplete="list"
            aria-controls="search-results"
          />
          <button type="button" id="search-clear" hidden>×</button>
        </div>
        <button type="button" id="btn-locate" hidden></button>
        <ul id="search-results" role="listbox" hidden></ul>
      </form>

      <aside class="panel" id="panel">
        <button type="button" class="sheet-handle" id="sheet-toggle" aria-expanded="false">
          <i class="sheet-bar"></i>
          <span class="sheet-peek-copy">
            <span id="sheet-peek"></span>
            <span class="sheet-peek-metrics" id="sheet-peek-metrics"></span>
          </span>
        </button>
        <div class="view-row" id="view-row">
          <button type="button" data-view="hex" id="btn-hex"></button>
          <button type="button" data-view="roofs" class="on" id="btn-roofs"></button>
        </div>

        <div class="view-row" id="base-row">
          <button type="button" data-base="on" class="on" id="btn-base-on"></button>
          <button type="button" data-base="off" id="btn-base-off"></button>
        </div>

        <div class="view-row" id="border-row">
          <button type="button" data-borders="on" class="on" id="btn-borders-on"></button>
          <button type="button" data-borders="off" id="btn-borders-off"></button>
        </div>

        <div class="city-row" id="city-row"></div>

        <div class="slider-block zoom-block">
          <span id="lbl-zoom"></span>
          <strong id="zoom-pct">0%</strong>
          <div class="zoom-controls">
            <button type="button" id="btn-zoom-out"></button>
            <input id="zoom-range" type="range" min="0" max="100" step="1" value="0" aria-labelledby="lbl-zoom" />
            <button type="button" id="btn-zoom-in"></button>
          </div>
        </div>

        <label class="slider-block">
          <span id="lbl-floor"></span>
          <strong id="floor-label">1</strong>
          <input id="class-floor" type="range" min="1" max="5" step="1" value="1" />
        </label>

        <div class="mode-row" id="mode-row">
          <button type="button" data-mode="mean" class="on" id="btn-mean"></button>
          <button type="button" data-mode="pct4" id="btn-pct4"></button>
        </div>

        <div id="stats">
          <p class="place-kicker" id="place-kicker"></p>
          <h2 id="place-name"></h2>
          <p class="sub" id="place-sub"></p>

          <div class="metrics">
            <div>
              <b id="m-mean">—</b>
              <span id="lbl-mean-metric"></span>
            </div>
            <div>
              <b id="m-pct4">—</b>
              <span id="lbl-pct-metric"></span>
            </div>
          </div>

          <p class="insight" id="insight"></p>

          <p class="chart-title" id="chart-title"></p>
          <div class="stack" id="bars"></div>
          <div class="axis">
            <span id="axis-low"></span>
            <span id="axis-high"></span>
          </div>

          <p class="baseline" id="baseline"></p>

          <div class="legend">
            <span><i class="dot moss"></i><span id="leg-low"></span></span>
            <span><i class="dot mid"></i><span id="leg-good"></span></span>
            <span><i class="dot sun"></i><span id="leg-ex"></span></span>
            <span><i class="dot empty"></i><span id="leg-floor"></span></span>
          </div>
        </div>
      </aside>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="i18n.js?v=30"></script>
    <script src="app.js?v=52"></script>
    <script src="ai.js?v=21"></script>
  </body>
</html>
